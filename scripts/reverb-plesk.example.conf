# Laravel Reverb on Plesk (www.legionis-group.asia)
#
# PHP process spawning is disabled on this host (exec/proc_open).
# Reverb must be started by Supervisor, SSH, or a Plesk Scheduled Task.
#
# App path: /var/www/vhosts/nur-stroy.kz/legionis-group.asia
# PHP:      /opt/alt/php84/usr/bin/php
#
# 1. .env production
#    BROADCAST_CONNECTION=reverb
#    REVERB_HOST=www.legionis-group.asia
#    REVERB_PORT=443
#    REVERB_SCHEME=https
#    REVERB_SERVER_HOST=127.0.0.1
#    REVERB_SERVER_PORT=8080
#    VITE_REVERB_* must match (rebuild frontend after change)
#
# 2. Nginx — Plesk domain → Apache & nginx Settings → Additional nginx directives
location /app {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}
#
# 3a. Preferred: Supervisor
[program:legionis-reverb]
process_name=%(program_name)s
command=/opt/alt/php84/usr/bin/php /var/www/vhosts/nur-stroy.kz/legionis-group.asia/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
user=nur_stroy_kz
redirect_stderr=true
stdout_logfile=/var/www/vhosts/nur-stroy.kz/legionis-group.asia/storage/logs/reverb.log
stopwaitsecs=3600
#
# 3b. Without SSH: Plesk → Scheduled Tasks → Add task
#     Run a command, cron "* * * * *"
#     /bin/bash /var/www/vhosts/nur-stroy.kz/legionis-group.asia/scripts/ensure-reverb.sh
