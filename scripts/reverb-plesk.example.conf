# Laravel Reverb on Plesk (legionis-group.asia)
#
# 1. .env production
#    BROADCAST_CONNECTION=reverb
#    REVERB_APP_ID=...
#    REVERB_APP_KEY=...
#    REVERB_APP_SECRET=...
#    REVERB_HOST=legionis-group.asia
#    REVERB_PORT=443
#    REVERB_SCHEME=https
#    REVERB_SERVER_HOST=127.0.0.1
#    REVERB_SERVER_PORT=8080
#    VITE_REVERB_* must match (npm run build after change)
#
# 2. Nginx (Additional nginx directives in Plesk domain)
location /app {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}
#
# 3. Supervisor (/etc/supervisor/conf.d/legionis-reverb.conf)
[program:legionis-reverb]
process_name=%(program_name)s
command=php /var/www/vhosts/legionis-group.asia/httpdocs/artisan reverb:start
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/legionis-reverb.log
stopwaitsecs=3600
